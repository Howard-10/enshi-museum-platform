[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enshi-museum-backend"
version = "0.1.0"
description = "Backend service for the Enshi museum intelligent guide"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.14,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "redis>=5.2,<7.0",
  "minio>=7.2,<8.0",
  "openpyxl>=3.1,<4.0",
  "docx2txt>=0.9,<1.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
